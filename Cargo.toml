[workspace]
resolver = "2"
members = [
  "crates/frost",
  "crates/frost-config",
  "crates/frost-lexer",
  "crates/frost-parser",
  "crates/frost-expand",
  "crates/frost-glob",
  "crates/frost-prompt",
  "crates/frost-history",
  "crates/frost-lisp",
  "crates/frost-exec",
  "crates/frost-zle",
  "crates/frost-complete",
  "crates/frost-builtins",
  "crates/frost-options",
  "crates/frost-compat",
  "crates/frost-verify",
  "crates/frost-spec",
  "crates/frost-mcp",
]

[workspace.package]
edition = "2024"
version = "0.1.13"
license = "MIT"
authors = ["pleme-io"]
repository = "https://github.com/pleme-io/frost"
homepage = "https://github.com/pleme-io/frost"

[workspace.dependencies]
# ── Internal crates: `path` AND `version`, never `path` alone ─────────────
#
# The `version` is not decoration and not a duplicate of the path — it is
# what makes these crates PUBLISHABLE. `cargo publish` strips `path` (the
# registry has no local directories) and falls back to the version
# requirement, so a bare `{ path = … }` fails the manifest check outright:
#
#   error: failed to verify manifest at crates/frost-complete/Cargo.toml
#     all dependencies must have a version requirement specified when
#     publishing.  dependency `frost-lisp` does not specify a version
#
# MEASURED, not anticipated: run 32608455667's "Ship workspace to registry"
# reported `permanent failures: frost-parser, frost-zle, frost-expand,
# frost-exec, frost-lisp, frost-mcp, frost-complete, frost` — eight of the
# fourteen, every one for this and nothing else. It was the FIRST time that
# job had ever executed: the Test gate had failed ahead of it on every prior
# push, so the publish leg was untested ground the moment the gate went
# green. auto-release.yml's header wants `frost-lisp` on crates.io precisely
# because other repos (estante) cannot publish while it is absent, and this
# is the line item that was blocking it.
#
# The pins stay in lockstep by construction, not by discipline: every member
# above declares `version.workspace = true` (verified for all 14), which is
# the exact condition `pleme-io/actions/rust-workspace-bump` requires before
# it rewrites an intra-workspace pin — so each bump moves the workspace
# version and these requirements together, in one pass.
frost-lexer = { path = "crates/frost-lexer", version = "0.1.13" }
frost-parser = { path = "crates/frost-parser", version = "0.1.13" }
frost-expand = { path = "crates/frost-expand", version = "0.1.13" }
frost-glob = { path = "crates/frost-glob", version = "0.1.13" }
frost-prompt = { path = "crates/frost-prompt", version = "0.1.13" }
frost-history = { path = "crates/frost-history", version = "0.1.13" }
frost-lisp = { path = "crates/frost-lisp", version = "0.1.13" }
frost-exec = { path = "crates/frost-exec", version = "0.1.13" }
frost-zle = { path = "crates/frost-zle", version = "0.1.13" }
frost-complete = { path = "crates/frost-complete", version = "0.1.13" }
frost-builtins = { path = "crates/frost-builtins", version = "0.1.13" }
frost-options = { path = "crates/frost-options", version = "0.1.13" }
frost-config = { path = "crates/frost-config", version = "0.1.13" }
frost-mcp = { path = "crates/frost-mcp", version = "0.1.13" }

# Error handling
thiserror = "2"
miette = { version = "7", features = ["fancy"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Async / IO
tokio = { version = "1", features = ["full"] }

# Data structures
indexmap = "2"
smallvec = "1"
compact_str = "0.8"
bstr = "1"

# OS interface
nix = { version = "0.29", features = ["signal", "process", "fs", "term"] }
libc = "0.2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
blake3 = "1.8"

# Tatara Rust+Lisp authoring — the canonical published crate. The
# retired pleme-io/tatara git source is `publish = false` on both halves;
# pleme-io/tatara-lisp is the single implementation, on crates.io, so the
# Nix daemon vendors it from the registry with no token or SSH key.
# The derive macros are re-exported RENAMED by the lib
# (`DeriveTataraDomain` / `DeriveKeywordSexp`) — never name
# `tatara-lisp-derive` as a dependency here.
# 0.3.41 is the floor, not a preference: it is the first release carrying
# `compile_typed_from_expanded`, the already-expanded input posture
# `frost-lisp`'s rc loader binds to. Below it the loader does not compile.
tatara-lisp = "0.3.41"

# ishou-tokens — fleet design + keybind atlas. FleetKeybinds is the
# typed source for every chord in rc.lisp; (defbind :intent :history-picker)
# resolves through this crate at apply time, killing the duplicate-bind
# class of bug (2026-05-21 Ctrl-R incident). HTTPS like tatara-lisp so
# the Nix daemon vendors via access-tokens.conf inside the sandbox.
# `version` alongside `git` for the same reason the internal crates above
# carry one: a git dependency has no version requirement, and `cargo publish`
# rejects the manifest without it. Locally and in CI the `rev` still wins and
# nothing about how frost builds changes; the version is what a PUBLISHED
# frost-lisp hands its consumers, resolved from crates.io. 0.1.3 is the
# version the pinned rev declares (see Cargo.lock) and it is published.
ishou-tokens = { git = "https://github.com/pleme-io/ishou", rev = "0197aeba1e9a7e17ff516272689dbca6a3ccc967", version = "0.1.3" }

# Testing
pretty_assertions = "1"
insta = { version = "1", features = ["yaml"] }

# Regex
fancy-regex = "0.14"

# Misc
itoa = "1"

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ── pleme-io reedline fork ─────────────────────────────────────────────
# CPR (ESC[6n cursor-position) is an optimization, never a liveness
# dependency: painter falls back to a safe row instead of erroring out of
# read_line (incident 2026-06-10 — lost/unanswered CPR killed or froze the
# shell). Fork repo created GitOps-natively by the (wedge-fixed) rio
# operator from org.yaml; upstream v0.42.0 + the painter patch.
#
# ── THIS BLOCK USED TO SAY frost NEEDS A REPO-LEVEL `BOT_PAT`. IT DOES NOT,
#    AND THAT SECRET IS NOW THE PROBLEM — CORRECTED 2026-08-22 ─────────────
#
# The retired text argued: "the fork repo is PRIVATE, and so is frost", so an
# ORG secret cannot reach either on the Free plan, so frost must carry a
# REPO-level BOT_PAT — set 2026-08-07 — and "deleting that secret re-breaks
# CI". Every load-bearing premise has since expired. Measured 2026-08-22 with
# `gh repo view`: reedline PUBLIC, frost PUBLIC, and so are substrate, gen and
# ishou. Nothing this repo resolves needs a credential.
#
# The reasoning inverted with the facts. That repo-level secret still holds
# the revoked classic PAT, and a repo secret SHADOWS the org one — so while
# four sibling repos authenticated fine against the live org BOT_PAT inside
# the same 67 seconds, frost alone was told "Bad credentials". A dead token is
# worse than none: nix attaches `access-tokens` to EVERY github.com request,
# so GitHub answered 401 for PUBLIC repos too, and all three of this repo's
# workflows died in under 25 seconds without reaching a test.
#
# So the sentence to carry forward is the opposite of the old one: KEEPING
# that secret is what breaks CI, and deleting it is the fix. All three
# workflows now withhold BOT_PAT and pass; see the notes in ci.yml,
# auto-release.yml and gen-spec.yml. Deleting the repo-level secret needs
# operator access — nix/docs/github-token-distribution.md is the destination
# (BOT_PAT to zero consumers).
#
# Kept, because it is still true and still the reason to pin by rev rather
# than float: a bare `git = "..."` with no rev floats on whatever main is,
# which is the crate2nix-vs-fetchgit hash-drift class. This entry is a
# `[patch.crates-io]`, which is stripped from a published manifest, so unlike
# a real git dependency it needs no `version` to stay publishable.
[patch.crates-io]
reedline = { git = "https://github.com/pleme-io/reedline" }
