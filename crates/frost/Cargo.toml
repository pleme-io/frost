[package]
name = "frost"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "A zsh-compatible shell written in Rust"

[[bin]]
name = "frost"
path = "src/main.rs"

[dependencies]
frost-lexer = { workspace = true }
frost-parser = { workspace = true }
frost-exec = { workspace = true }
frost-builtins = { workspace = true }
frost-options = { workspace = true }
frost-zle = { workspace = true }
frost-complete = { workspace = true }
frost-prompt = { workspace = true }
frost-history = { workspace = true }
frost-lisp = { workspace = true }
frost-mcp = { workspace = true }
# Kanshou — live process introspection. Frost opens a kanshou socket
# exposing the live shell state (rc-load posture, prompt-render
# state, pending VT response queries, current command, history file)
# so operator tools and external MCP servers query the actual shell
# state. Closes the 'frost hangs and we can't see why' class.
kanshou = { git = "https://github.com/pleme-io/kanshou" }
parking_lot = "0.12"
serde_json = "1"
tokio = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
miette = { workspace = true }
libc = { workspace = true }
# Direct crossterm import for multi-key chord dispatch: after
# reedline yields the terminal on a `__frost_chord_prefix_*__`
# ExecuteHostCommand, we re-enter raw mode briefly to consume one
# more keystroke and dispatch to the rc-registered continuation.
crossterm = "0.29"

[dev-dependencies]
frost-compat = { path = "../frost-compat" }
reedline = "0.42"
