[package]
name = "frost"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "A zsh-compatible shell written in Rust"

[[bin]]
name = "frost"
path = "src/main.rs"

[dependencies]
frost-lexer = { workspace = true }
frost-parser = { workspace = true }
frost-exec = { workspace = true }
frost-builtins = { workspace = true }
frost-options = { workspace = true }
frost-zle = { workspace = true }
frost-complete = { workspace = true }
frost-prompt = { workspace = true }
frost-history = { workspace = true }
frost-lisp = { workspace = true }
frost-mcp = { workspace = true }
# Kanshou — live process introspection. Frost opens a kanshou socket
# exposing the live shell state (rc-load posture, prompt-render
# state, pending VT response queries, current command, history file)
# so operator tools and external MCP servers query the actual shell
# state. Closes the 'frost hangs and we can't see why' class.
kanshou = { git = "https://github.com/pleme-io/kanshou" }
parking_lot = "0.12"
serde_json = "1"
tokio = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
miette = { workspace = true }
libc = { workspace = true }
# Direct crossterm import for multi-key chord dispatch: after
# reedline yields the terminal on a `__frost_chord_prefix_*__`
# ExecuteHostCommand, we re-enter raw mode briefly to consume one
# more keystroke and dispatch to the rc-registered continuation.
crossterm = "0.29"

[dev-dependencies]
frost-compat = { path = "../frost-compat" }
reedline = "0.42"
# ─── boot_harness integration test (★★ Shigoto rule) ───────────────────
# The frostmourne boot path (parse rc.lisp → apply each rc form) is a
# typed work graph: ≥3 sequential steps with per-step timeout concerns.
# `tests/boot_harness.rs` wraps each .lisp file as a BootStepJob +
# RecordingJob and runs them through the canonical
# `InProcessScheduler` so hangs surface as typed Job failures
# (Deadlettered / never-Succeeded) instead of "user sees empty
# screen." Mirrors the pattern proven in tend/src/jobs/*.
frost-lisp = { workspace = true }
frost-exec = { workspace = true }
shigoto-types = { git = "https://github.com/pleme-io/shigoto" }
shigoto-scheduler = { git = "https://github.com/pleme-io/shigoto" }
shigoto-dag = { git = "https://github.com/pleme-io/shigoto" }
shigoto-emit = { git = "https://github.com/pleme-io/shigoto" }
shigoto-budget = { git = "https://github.com/pleme-io/shigoto" }
shigoto-retry = { git = "https://github.com/pleme-io/shigoto" }
async-trait = "0.1"
thiserror = { workspace = true }
# ─── persona_pty L0 harness (terminal integration-test plan M0) ────────
# tests/persona_pty.rs drives the REAL frost binary on a real PTY under a
# typed espelho::TerminalPersona (Answer / Mute / SplitReply /
# AnswerThenMute policies) and asserts liveness invariants: never-fatal
# CPR, post-accept-line survival (the 2026-06-10 CPR answer-loss race),
# fragmented-reply tolerance, mid-session host death. espelho owns the
# query catalog + answer wires + policy algebra; this file keeps only
# the PTY plumbing.
espelho = { git = "https://github.com/pleme-io/espelho" }
nix = { workspace = true }
libc = { workspace = true }
tempfile = "3"
