[package]
name = "frost-zle"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Zsh Line Editor (ZLE)"

[dependencies]
frost-lexer = { workspace = true }
frost-options = { workspace = true }
nu-ansi-term = "0.50"
thiserror = { workspace = true }
nix = { workspace = true }
reedline = "0.42"
# `reedline::CursorConfig` carries `crossterm::cursor::SetCursorStyle`
# and reedline re-exports only KeyCode / KeyModifiers / Color, so the
# per-mode cursor shapes have to come from crossterm directly. Pinned
# to 0.28 to match reedline's own crossterm — a 0.29 `SetCursorStyle`
# is a different type and would not compile into `CursorConfig`.
crossterm = "0.28"

[dev-dependencies]
pretty_assertions = { workspace = true }
insta = { workspace = true }
tempfile = "3.27.0"
