[package]
name = "frost-exec"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Zsh-compatible command execution engine"

[dependencies]
frost-lexer = { workspace = true }
frost-parser = { workspace = true }
frost-expand = { workspace = true }
frost-glob = { workspace = true }
frost-builtins = { workspace = true }
frost-options = { workspace = true }
indexmap = { workspace = true }
compact_str = { workspace = true }
thiserror = { workspace = true }
nix = { workspace = true }
libc = { workspace = true }
tracing = { workspace = true }
fancy-regex = { workspace = true }
# awase — modal hotkey / keymode state machine. Frost-exec keeps a typed
# `ModalState` next to the shell environment so the interactive surface
# can route keystrokes through Normal (passthrough), Command (`:` prefix),
# and Search (`/` `?` scrollback) modes. Re-uses the same primitive that
# mado / ayatsuri / namimado consume — no duplicate state machine.
awase = { git = "https://github.com/pleme-io/awase" }
# wadachi (轍) — directory frecency. frost is the SOLE recorder: it records
# every dir change at the chdir chokepoint and resolves smart-cd, both IN-PROCESS
# (lib is imported as `wadachi`; package is pleme-io-wadachi). Behind a default
# feature so the engine still builds standalone with --no-default-features.
# crates.io (not git): a published crate is root-level, so gen's lockfile-builder
# finds src/lib.rs (a git workspace-member in a subdir does not → "extern
# location does not exist"). Lib imported as pleme_io_wadachi.
pleme-io-wadachi = { version = "0.1.4", optional = true }

[features]
default = ["frecency-wadachi"]
# In-process wadachi directory frecency (record-on-cd + smart-cd). On by default
# for the fleet; opt out with --no-default-features to build a pure shell engine.
frecency-wadachi = ["dep:pleme-io-wadachi"]

[dev-dependencies]
frost-lexer = { workspace = true }
pretty_assertions = { workspace = true }
insta = { workspace = true }
