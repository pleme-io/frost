name: auto-release

# The three-line consumer shim of ★★ AUTO-RELEASE: every push to main runs
# substrate's Rust-workspace pipeline (bump workspace version → commit → tag →
# push → publish each member to crates.io in dependency order).
#
# ── WHY THIS DID NOT EXIST UNTIL 2026-08-08 ────────────────────────────────
#
# frost was a PRIVATE repo, and a private repo cannot publish to crates.io —
# so the doctrine's "a packaged artifact publishes on merge" had nothing to
# attach to and the gap read as deliberate. It was not: it made `frost-lisp`
# unpublishable, and `frost-lisp` is a real dependency of other repos.
#
# The receipt is estante, which consumed it the only way left — by git:
#
#   frost-lisp = { git = "https://github.com/pleme-io/frost", branch = "main" }
#
# That fails crates.io's rule that "all dependencies must have a version
# specified when publishing", so estante could not publish EITHER. One
# unpublished crate had propagated unpublishability downstream. frost is
# public as of 2026-08-08, which removes the only real blocker.
#
# `secrets: inherit` is load-bearing and now actually works: pleme-io is on
# GitHub Free, where an ORG secret reaches PUBLIC repos only — so
# CRATES_API_TOKEN arrives here precisely because the repo is public.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump-type:
        description: "patch | minor | major"
        required: false
        default: patch

jobs:
  release:
    uses: pleme-io/substrate/.github/workflows/rust-auto-release.yml@main
    with:
      bump-type: ${{ inputs.bump-type || 'patch' }}
    secrets: inherit
